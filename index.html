<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Simple homepage for any browser, with customizable search engine."
    />
    <title>Homepage</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"
    />
  </head>
  <body>
    <div class="layout">
      <!-- Begins the settings part -->
      <div
        id="settings"
        onclick="showSettings(event)"
        title="Open the settings"
      >
        <div class="menuline"></div>
        <div class="menuline"></div>
        <div class="menuline"></div>
      </div>
      <div
        id="settings_open"
        onclick="showSettings(event)"
        title="Close the settings"
      >
        <div class="line1"></div>
        <div class="line2"></div>
      </div>
      <div class="settings_menu">
        <div class="settings_text">
          <h1 class="settings_header_div">Settings</h1>
          <br />
          <hr class="settings_hr" />
          <br />
          <h2 class="settings_header">Search Engine</h2>

          <select id="settings_engine" title="Choose the search engine">
            <option value="Bing" title="Bing">Bing</option>
            <option value="Brave" title="Brave">Brave</option>
            <option value="DuckDuckGo" title="DuckDuckGo">DuckDuckGo</option>
            <option value="Ecosia" title="Ecosia">Ecosia</option>
            <option value="Google" title="Google">Google</option>
            <option value="Karma" title="Karma">Karma</option>
            <option value="Qwant" title="Qwant">Qwant</option>
            <option value="Reddit" title="Reddit">Reddit</option>
            <option value="Wikipedia" title="Wikipedia">Wikipedia</option>
            <option value="Yahoo" title="Yahoo">Yahoo</option>
            <option value="YouTube" title="YouTube">YouTube</option>
            <option value="Custom" title="Custom URL">Custom URL</option>
          </select>
          <br />
          <br />
          <hr class="settings_hr" />
          <br />

          <h2 class="settings_header">Quick Links</h2>
          <!-- Checkboxes for quick links -->
          <!-- All the checkboxes are aligned to the left to maintain a consistent look -->

          <div id="checkboxes">
            <table class="checkboxes_table">
              <tr>
                <td class="checkboxes_td">
                  <input type="checkbox" id="github" checked />
                </td>
                <td><label for="github" title="GitHub">GitHub</label></td>
              </tr>

              <tr>
                <td class="checkboxes_td">
                  <input type="checkbox" id="stackoverflow" checked />
                </td>
                <td>
                  <label for="stackoverflow" title="Stack Overflow"
                    >Stack Overflow</label
                  >
                </td>
              </tr>
              <tr>
                <td class="checkboxes_td">
                  <input type="checkbox" id="linkedin" checked />
                </td>
                <td><label for="linkedin" title="linkedin">LinkedIn</label></td>
              </tr>
              <tr>
                <td class="checkboxes_td">
                  <input type="checkbox" id="chatgpt" checked />
                </td>
                <td><label for="chatgpt" title="ChatGPT">ChatGPT</label></td>
              </tr>
              <tr>
                <td class="checkboxes_td">
                  <input type="checkbox" id="wikipedia" checked />
                </td>
                <td>
                  <label for="wikipedia" title="Wikipedia">Wikipedia</label>
                </td>
              </tr>
              <tr>
                <td class="checkboxes_td">
                  <input type="checkbox" id="youtube" checked />
                </td>
                <td><label for="youtube" title="YouTube">YouTube</label></td>
              </tr>
              <tr>
                <td class="checkboxes_td">
                  <input type="checkbox" id="reddit" checked />
                </td>
                <td><label for="reddit" title="Reddit">Reddit</label></td>
              </tr>
              <tr>
                <td class="checkboxes_td">
                  <input type="checkbox" id="strava" checked />
                </td>
                <td><label for="strava" title="Strava">Strava</label></td>
              </tr>
              <tr class="spacer">
                <td colspan="2"></td>
              </tr>
              <tr class="divider_checkbox">
                <td class="checkboxes_td">
                  <input type="checkbox" id="divider_line" checked />
                </td>
                <td>
                  <label for="divider_line" title="Divider line"
                    >Show divider line</label
                  >
                </td>
              </tr>
            </table>

            <br />
            <h2 class="settings_header">Custom Search URL</h2>
            <textarea
              id="custom_url"
              placeholder="Custom Search URL"
              title="Base URL of the custom search engine. For example:&#10;https://example.com/search?q="
              disabled
            ></textarea>
            <!-- &#10; represents a newline, this trick is supposedly NOT universally supported-->
            <br />
            <br />
            <h2 class="settings_header">Custom Placeholder</h2>
            <textarea
              id="custom_placeholder"
              placeholder="Custom Placeholder"
              title="Enter the placeholder text for the custom search engine"
              disabled
            ></textarea>
          </div>

          <br />
          <hr class="settings_hr" />
          <br />

          <button
            id="apply"
            onclick="applySettings()"
            title="Apply the new settings"
          >
            Apply
          </button>
          <br />

          <br />
          <button
            id="reset"
            onclick="resetSettings()"
            title="Reset settings to default"
          >
            Reset settings
          </button>
          <br />
          <br />
          <div id="status"></div>
          <div id="keyboard_shortcuts">
            <hr class="settings_hr" />
            <br />
            <h2 class="settings_header">Keyboard Shortcuts</h2>
            <table class="checkboxes_table">
              <tr>
                <td class="checkboxes_td">
                  <kbd>Ctrl + K</kbd>
                </td>
                <td>Focus search bar</td>
              </tr>
              <tr>
                <td class="checkboxes_td">
                  <kbd>Ctrl + .</kbd>
                </td>
                <td>Toggle settings</td>
              </tr>
              <tr>
                <td class="checkboxes_td">
                  <kbd>Esc</kbd>
                </td>
                <td>Close settings</td>
              </tr>
            </table>
            <br />
          </div>
          <a
            class="hoverlink github_link"
            href="https://github.com/anic17/homepage"
            target="_blank"
          >
            <span>View on GitHub ↗</span>
          </a>
        </div>

        <br />
      </div>
      <!-- Ends the settings part -->

      <!-- Begins the start page -->
      <div class="mainscreen">
        <noscript class="text headers">
          <h1>This page requires JavaScript to work</h1>
          <br />
          <br />
        </noscript>

        <h1 class="headers">Homepage</h1>

        <input
          id="searchbar"
          type="text"
          placeholder="Search with DuckDuckGo"
          title="Search the web"
          autofocus
          onkeydown="searchWeb(event)"
        />
        <hr id="hrfocus" />

        <div class="icons">
          <a href="https://github.com" class="github"
            ><img
              width="30"
              height="30"
              src="assets/icons/github.svg"
              title="GitHub" /></a
          ><a href="https://stackoverflow.com" class="stackoverflow"
            ><img
              width="30"
              height="30"
              src="assets/icons/stack-overflow.svg"
              title="Stack Overflow" /></a
          ><a href="https://linkedin.com" class="linkedin"
            ><img
              width="30"
              height="30"
              src="assets/icons/linkedin.svg"
              title="LinkedIn" /></a
          ><a href="https://chatgpt.com" class="chatgpt"
            ><img
              width="30"
              height="30"
              src="assets/icons/chatgpt.svg"
              title="ChatGPT" /></a
          ><a href="https://wikipedia.org" class="wikipedia"
            ><img
              width="30"
              height="30"
              src="assets/icons/wikipedia.svg"
              title="Wikipedia" /></a
          ><a href="https://youtube.com" class="youtube"
            ><img
              width="30"
              height="30"
              src="assets/icons/youtube.svg"
              title="YouTube" /></a
          ><a href="https://reddit.com" class="reddit"
            ><img
              width="30"
              height="30"
              src="assets/icons/reddit.svg"
              title="Reddit" /></a
          ><a href="https://strava.com" class="strava"
            ><img
              width="30"
              height="30"
              src="assets/icons/strava.svg"
              title="Strava"
          /></a>
        </div>
      </div>
      <footer class="text">
        Made by
        <a class="hoverlink" href="https://anic17.github.io">anic17</a>.
        <a class="hoverlink" href="https://github.com/anic17/homepage">Source</a
        >.<br />
      </footer>
    </div>
    <script src="index.js"></script>
  </body>
</html>
